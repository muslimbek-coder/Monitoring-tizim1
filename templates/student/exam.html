<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>Test jarayoni — Monitoring tizimi</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="exam-body" oncontextmenu="return false" onselectstart="return false">

<div id="focus-warning" class="focus-warning hidden">
  Diqqat! Sahifadan chiqmang / skrinshot olishga urinmang — bu qayd etiladi.
</div>

<div class="exam-wrap">
  <div class="exam-main">
    <div class="exam-top">
      <span id="timer" class="timer">90:00</span>
      <span id="progress"></span>
    </div>
    <div id="question-box" class="question-box">Yuklanmoqda...</div>
  </div>

  <aside class="exam-nav">
    <div id="nav-grid" class="nav-grid"></div>
    <button id="finish-btn" class="finish-btn" disabled>Yakunlash</button>
  </aside>
</div>

<div id="result-overlay" class="result-overlay hidden">
  <div class="card">
    <h2>Test yakunlandi</h2>
    <div id="result-body"></div>
  </div>
</div>

<script>window.SESSION_ID = {{ session_id }};</script>
<script src="/static/js/exam.js"></script>
</body>
</html>
